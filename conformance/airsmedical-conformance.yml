description: >-
  Standards AIRS Medical states its products and operations conform to, harvested from the
  company's own public pages. There is no OpenAPI or other machine-readable contract to derive from,
  so every entry is a published prose claim with the page that makes it; nothing here is asserted
  from a spec. The one domain standard in play is DICOM: SwiftMR and SwiftSight-Hub speak the DICOM
  image-transmission protocol to the scanner and PACS (SwiftSight-Hub 1.0.2.0 added PACS
  Query/Retrieve). That is the healthcare-imaging interoperability standard, but it is a local
  network protocol the product implements, not a published web-API contract, so it is recorded as a
  conformance claim and not as a contract.
