description: >-
  AIRS Medical publishes no pricing and no plan tiers. There is no /pricing page (the site has
  no such URL in its sitemap), and every product path ends in "Book a demo", "Talk to an expert"
  or a free-trial form. SwiftMR and SwiftSight are regulated medical-device software sold to
  hospitals and imaging centers under enterprise agreements; the site offers an ROI calculator
  (/swiftmr/roi/) in place of a price list. The only published commercial term is the trial: the
  FAQ states a one-month free trial of SwiftMR and that demo licenses are never extended beyond
  one month as a matter of policy. There is no API to price.
