aid: airsmedical
name: AIRS Medical
description: >-
  AIRS Medical (AI Radiology Solutions) is a Seoul-founded medical-AI company whose SwiftMR
  deep-learning MRI reconstruction software cuts scan times by up to 50% on existing scanners,
  and whose SwiftSight products deliver quantitative brain, DTI and body-composition reporting.
  SwiftMR is FDA 510(k)-cleared, CE-marked under EU MDR, PMDA-approved and MDSAP-certified, and
  is deployed at 1,700+ institutions in 40+ countries. The products integrate with hospital
  MRI scanners and PACS over the DICOM protocol (SwiftMR presents itself to the scanner as a
  PACS node); the company publishes no public developer program, API, SDK or webhooks.
