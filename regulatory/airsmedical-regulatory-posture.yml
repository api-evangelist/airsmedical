note: >-
  Harvest only; nothing here decides which regime applies. AIRS Medical is unusually well
  documented for a company with no API: the /compliance/ hub links a dated Accessibility
  Statement with a named WCAG conformance level, a dated AI Transparency Statement, a Privacy
  Rights and Inquiries request form, and a versioned Privacy Policy (v2.1, effective September
  14, 2026) that states GPC signals are honored and gives breach-notification commitments.
  Signals NOT found and therefore omitted: SBOM (none published; robots.txt even disallows
  /wp-content/uploads/*.json), support lifetime (release notes carry no stated support period),
  training-data summary (the AI statement only says customer/patient data is not used for
  training without authorization — a policy, not a summary of the training corpus), a dated
  subprocessor table (the privacy policy names recipient categories and Workable by name, not a
  table), data residency (the policy says AWS data is "generally processed and stored in the
  region where the service is delivered", with no selectable regions), age assurance, notice and
  action, transparency report, exit assistance.
